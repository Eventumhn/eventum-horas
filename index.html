<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventum</title>
<meta name="description" content="La app del equipo Eventum: horas, eventos, viáticos y más.">
<meta name="theme-color" content="#0b0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eventum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0b0a14; --fg:#f5f3fb; --muted:#aaa4c4; --o1:#ee4b22; --o2:#f07022; --amber:#f39c1f; --p1:#5b3e99; --p2:#9d87c0; color-scheme: dark; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg);
         padding-top:env(safe-area-inset-top,0px); box-sizing:border-box; opacity:0; transition:opacity .5s ease; }
  #app.listo { opacity:1; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
            background:radial-gradient(90% 60% at 30% 10%, rgba(238,75,34,.35), transparent 60%),
                       radial-gradient(90% 60% at 80% 90%, rgba(91,62,153,.5), transparent 60%), var(--bg);
            transition:opacity .6s ease, transform .6s ease; z-index:2; padding:24px; text-align:center; overflow:hidden; }
  #splash.fuera { opacity:0; transform:scale(1.06); pointer-events:none; }
  /* Cubos flotando de fondo */
  .cubo { position:absolute; width:22px; height:22px; border-radius:5px; opacity:.0; animation:flota 7s ease-in-out infinite; }
  .cubo:nth-child(1) { left:12%; top:18%; background:var(--o1); animation-delay:.2s; }
  .cubo:nth-child(2) { left:80%; top:14%; background:var(--p2); width:16px; height:16px; animation-delay:1.1s; }
  .cubo:nth-child(3) { left:18%; top:78%; background:var(--amber); width:14px; height:14px; animation-delay:2s; }
  .cubo:nth-child(4) { left:76%; top:72%; background:var(--p1); width:26px; height:26px; animation-delay:.6s; }
  .cubo:nth-child(5) { left:50%; top:8%; background:var(--o2); width:12px; height:12px; animation-delay:2.8s; }
  .cubo:nth-child(6) { left:88%; top:45%; background:var(--amber); width:12px; height:12px; animation-delay:3.4s; }
  .cubo:nth-child(7) { left:6%; top:48%; background:var(--p2); width:18px; height:18px; animation-delay:1.6s; }
  /* Logo con anillos girando */
  .logo { position:relative; width:150px; height:150px; display:grid; place-items:center; }
  .logo img { width:104px; height:104px; border-radius:26px; position:relative; z-index:1;
              animation:entra .9s cubic-bezier(.2,1.4,.4,1) both, respira 2.6s ease-in-out .9s infinite; }
  .anillo { position:absolute; inset:0; border-radius:50%; border:3px solid transparent; }
  .anillo.a1 { border-top-color:var(--o1); border-right-color:var(--amber); animation:gira 1.6s linear infinite; }
  .anillo.a2 { inset:12px; border-bottom-color:var(--p2); border-left-color:var(--p1); animation:gira 2.4s linear infinite reverse; }
  .brillo { position:absolute; inset:18px; border-radius:50%; background:radial-gradient(circle, rgba(240,112,34,.45), transparent 70%); animation:late 2.6s ease-in-out infinite; }
  .marca { font:800 32px/1.1 system-ui, sans-serif; letter-spacing:.2em; display:flex; justify-content:center; }
  .marca span { display:inline-block; opacity:0; animation:letra .5s ease forwards; background:linear-gradient(180deg,#fff,#ffd9c7); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font:600 13px system-ui, sans-serif; letter-spacing:.3em; text-transform:uppercase; color:var(--amber); opacity:0; animation:aparece .6s ease 1.1s forwards; margin-top:-8px; }
  .barra { width:min(60vw,240px); height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; opacity:0; animation:aparece .5s ease 1.3s forwards; }
  .barra i { display:block; height:100%; width:40%; border-radius:99px; background:linear-gradient(90deg,var(--o1),var(--amber),var(--p2)); animation:corre 1.3s ease-in-out infinite; }
  #splash p { margin:0; color:var(--muted); font-size:14px; min-height:20px; transition:opacity .3s; }
  @keyframes entra { 0% { transform:scale(.2) rotate(-200deg); opacity:0; } 100% { transform:none; opacity:1; } }
  @keyframes respira { 50% { transform:scale(1.06); filter:drop-shadow(0 0 22px rgba(240,112,34,.55)); } }
  @keyframes gira { to { transform:rotate(360deg); } }
  @keyframes late { 50% { transform:scale(1.25); opacity:.5; } }
  @keyframes letra { 0% { opacity:0; transform:translateY(14px) scale(.8); } 100% { opacity:1; transform:none; } }
  @keyframes aparece { to { opacity:1; } }
  @keyframes flota { 0% { opacity:0; transform:translateY(20px) rotate(0); } 20% { opacity:.55; } 80% { opacity:.55; } 100% { opacity:0; transform:translateY(-60px) rotate(180deg); } }
  @keyframes corre { 0% { transform:translateX(-110%); } 100% { transform:translateX(260%); } }
  #lento { display:none; }
  #lento button, #instalar { font:600 15px system-ui, sans-serif; color:#fff; border:0; border-radius:14px; padding:12px 18px;
            background:linear-gradient(135deg,var(--o1),var(--o2)); box-shadow:0 8px 24px rgba(238,75,34,.35); cursor:pointer; }
  /* Aviso para instalar */
  #aviso { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:3;
           background:rgba(28,24,52,.96); border:1px solid rgba(255,255,255,.14); border-radius:18px; padding:14px 16px;
           display:none; gap:12px; align-items:center; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #aviso.ver { display:flex; }
  #aviso img { width:44px; height:44px; border-radius:11px; flex:0 0 auto; }
  #aviso div { flex:1; font-size:14px; color:var(--muted); }
  #aviso b { color:var(--fg); display:block; font-size:15px; }
  #cerrar { background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; padding:4px 6px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <i class="cubo"></i><i class="cubo"></i><i class="cubo"></i><i class="cubo"></i><i class="cubo"></i><i class="cubo"></i><i class="cubo"></i>
    <div class="logo" aria-hidden="true"><div class="brillo"></div><div class="anillo a1"></div><div class="anillo a2"></div><img src="icon-192.png" alt=""></div>
    <div class="marca" aria-label="Eventum"><span style="animation-delay:0.55s">E</span><span style="animation-delay:0.62s">V</span><span style="animation-delay:0.69s">E</span><span style="animation-delay:0.76s">N</span><span style="animation-delay:0.83s">T</span><span style="animation-delay:0.90s">U</span><span style="animation-delay:0.97s">M</span></div>
    <div class="sub">App del equipo</div>
    <div class="barra" aria-hidden="true"><i></i></div>
    <p id="msg">Preparando tu app…</p>
    <div id="lento"><button type="button" id="reintentar">Volver a intentar</button></div>
  </div>

  <iframe id="app" title="Eventum"
          allow="geolocation *; camera *; clipboard-write *"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="aviso" role="dialog" aria-label="Instalar la app">
    <img src="icon-192.png" alt="">
    <div id="avisoTxt"></div>
    <button type="button" id="instalar" hidden>Instalar</button>
    <button type="button" id="cerrar" aria-label="Cerrar">&times;</button>
  </div>

<script>
  // Dirección de la app de Google (la misma que usa todo el equipo)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyipUDT9rYIrbMsW1Nbu5XjPD3PN3Gh1dEb5dN-wffnSKhjNc9l93lkKlfJ8MPA-MNJ/exec';

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var cargas = 0, temporizador, mostrado = false;
  // Muestra la app apenas avisa que está lista (en vez de esperar un tiempo fijo)
  function mostrar() {
    if (mostrado) return; mostrado = true;
    clearTimeout(temporizador);
    frame.classList.add('listo'); splash.classList.add('fuera');
  }
  window.addEventListener('message', function (ev) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(ev.origin)) return;
    var t = ev.data && ev.data.tipo;
    if (t === 'appLista' || t === 'offHola') setTimeout(mostrar, 120);
  });

  var FRASES_C = ['Preparando tu app…', 'Cargando tus eventos…', 'Revisando tus horas…', 'Poniendo todo en orden…', 'Casi listo…'], fraseT;
  function frases() {
    clearInterval(fraseT); var i = 0, m = document.getElementById('msg');
    fraseT = setInterval(function () { if (mostrado) { clearInterval(fraseT); return; } i = Math.min(i + 1, FRASES_C.length - 1); m.style.opacity = 0; setTimeout(function () { m.textContent = FRASES_C[i]; m.style.opacity = 1; }, 300); if (i === FRASES_C.length - 1) clearInterval(fraseT); }, 1800);
  }
  function abrir() {
    document.getElementById('lento').style.display = 'none';
    document.getElementById('msg').textContent = 'Preparando tu app…'; frases();
    mostrado = false; splash.classList.remove('fuera'); frame.classList.remove('listo');
    clearTimeout(temporizador);
    temporizador = setTimeout(function () {
      clearInterval(fraseT); document.getElementById('msg').textContent = 'Está tardando más de lo normal. Revisa tu conexión.';
      document.getElementById('lento').style.display = 'block';
    }, 25000);
    frame.src = APP_URL + (APP_URL.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
  }
  frame.addEventListener('load', function () {
    cargas++;
    clearTimeout(temporizador);
    // Google arma la app en varios pasos; mantenemos la pantalla de carga mientras pinta.
    // Respaldo por si el aviso de "lista" no llega
    setTimeout(mostrar, cargas === 1 ? 9000 : 1500);
  });
  document.getElementById('reintentar').onclick = abrir;
  abrir();

  // Registro del service worker (permite instalar y abrir rápido)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // Aviso de instalación
  var instalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var aviso = document.getElementById('aviso'), txt = document.getElementById('avisoTxt'), btn = document.getElementById('instalar');
  var cerrado = false;
  try { cerrado = localStorage.getItem('avisoCerrado') === '1'; } catch (e) {}
  document.getElementById('cerrar').onclick = function () { aviso.classList.remove('ver'); try { localStorage.setItem('avisoCerrado', '1'); } catch (e) {} };

  if (!instalada && !cerrado) {
    if (esIOS) {
      txt.innerHTML = '<b>Instala Eventum</b>Toca <b style="display:inline">Compartir</b> (el cuadro con la flecha) y luego <b style="display:inline">“Agregar a inicio”</b>.';
      setTimeout(function () { aviso.classList.add('ver'); }, 4000);
    } else {
      var evento = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); evento = e;
        txt.innerHTML = '<b>Instala Eventum</b>Tenla en tu pantalla de inicio como una app.';
        btn.hidden = false; aviso.classList.add('ver');
      });
      btn.onclick = function () {
        if (!evento) return;
        evento.prompt();
        evento.userChoice.finally(function () { evento = null; aviso.classList.remove('ver'); });
      };
      // Si el navegador no ofrece el botón, damos la instrucción manual
      setTimeout(function () {
        if (!evento && !aviso.classList.contains('ver')) {
          txt.innerHTML = '<b>Instala Eventum</b>Abre el menú ⋮ del navegador y elige <b style="display:inline">“Instalar app”</b> o <b style="display:inline">“Agregar a pantalla principal”</b>.';
          aviso.classList.add('ver');
        }
      }, 6000);
    }
  }
</script>
<script src="sinconexion.js?v=2"></script>
<script src="notificaciones.js?v=1"></script>
</body>
</html>
