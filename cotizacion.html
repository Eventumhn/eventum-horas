<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0d0b17">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solicitud de cotización · Eventum</title>
<meta name="description" content="Cuéntanos de tu evento y te armamos una propuesta a tu medida. Solo tocar y listo.">
<meta property="og:title" content="Cotiza tu evento · Eventum">
<meta property="og:description" content="Audio, iluminación, pantallas LED, tarimas y proyectos a la medida. Respuesta en menos de 24 horas.">
<meta property="og:image" content="https://eventumhn.github.io/eventum-horas/icon-192.png">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
--stage:#0d0b17; --panel:#1b1630; --panel-2:#241d3d; --line:#342b55; --card:rgba(27,22,48,.8);
--fg:#fbf8ff; --muted:#c9c1dd; --dim:#9a90b8; --accent:#ee4b22; --accent-2:#ff7a4d; --accent-ink:#ffffff;
--purple:#7c5cd6; --lav:#b49cff; --gold:#f5a524; --green:#2fbf8f; --mint:#4fd6a3; --brick:#ff5a4d;
--f-display:"Rubik",ui-sans-serif,system-ui,sans-serif;
--f-body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font:16px/1.5 var(--f-body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 18% 14%,#4a1f22 0,transparent 36%),radial-gradient(circle at 84% 20%,#3b2a6e 0,transparent 40%),radial-gradient(circle at 50% 100%,#2a1a45 0,transparent 44%)}
#lights{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;min-height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
padding-block:max(20px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 23px var(--f-display);letter-spacing:-.01em;color:var(--fg)}
.brand img{height:36px;width:auto;display:block;filter:drop-shadow(0 6px 14px rgba(238,75,34,.45))}
.step-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.step-count:empty{display:none}
.bar{height:8px;border-radius:99px;background:#221b3a;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent),var(--purple));transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;box-shadow:0 0 18px rgba(238,75,34,.6)}
.bar span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%)}
.sections{display:flex;gap:6px;flex-wrap:wrap}
.sections b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-weight:800;transition:all .3s}
.sections b.on{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 6px 18px -6px var(--accent)}
.sections b.done{color:var(--mint);border-color:rgba(79,214,163,.4)}
.sections b.done::before{content:"✓ "}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,40px);
box-shadow:0 30px 80px -30px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:22px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--purple))}
.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1,h2{color:var(--fg);font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(34px,8vw,54px);line-height:1.03;font-weight:800}
h2{font-size:clamp(24px,5.4vw,34px);line-height:1.12;font-weight:700}
.lead{color:var(--muted);margin:0;max-width:56ch;font-size:17px}
.hint{font-size:14px;color:var(--dim);margin:-10px 0 0}
.hero{width:96px;height:auto;filter:drop-shadow(0 14px 28px rgba(238,75,34,.5))}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills b{font-size:13px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:99px}
/* Controles */
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.stars{display:flex;gap:8px;flex-wrap:wrap}
.star{width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.star svg{width:30px;height:30px;fill:none;stroke:var(--dim);stroke-width:1.6}
.star.on{background:rgba(245,165,36,.14);border-color:var(--gold);box-shadow:0 0 24px -4px rgba(245,165,36,.65)}
.star.on svg{fill:var(--gold);stroke:var(--gold)}
.star:hover{transform:translateY(-4px)}
.star-label{font:800 20px var(--f-display);min-height:30px;color:var(--gold)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.face{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.face svg{width:42px;height:42px;transition:transform .3s}
.face small{font-size:12px;color:var(--dim);font-weight:700;text-align:center;line-height:1.2}
.face:hover svg{transform:scale(1.12)}
.face[aria-pressed="true"]{background:rgba(238,75,34,.15);border-color:var(--accent);transform:translateY(-6px);box-shadow:0 14px 30px -12px rgba(238,75,34,.75)}
.face[aria-pressed="true"] small{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:12px 18px;font-weight:700;transition:all .2s}
.chip:hover{border-color:var(--accent-2);color:var(--fg)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 10px 24px -10px var(--accent)}
.matrix{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.mrow .lbl{font-weight:700}
.mrow .lbl small{display:block;color:var(--dim);font-weight:600;font-size:13px}
.dots{display:flex;gap:6px}
.dot{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#14102a;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim);transition:all .2s cubic-bezier(.3,1.6,.5,1)}
.dot[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.12);box-shadow:0 6px 16px -6px var(--accent)}
.dot.na{width:auto;padding:0 10px;font-size:12px}
.dot.na[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);box-shadow:0 6px 16px -6px var(--purple)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.range-wrap{display:flex;flex-direction:column;gap:12px}
.emo{font-size:58px;line-height:1;height:62px}
.big{font:800 clamp(64px,16vw,104px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em;background:linear-gradient(120deg,var(--gold),var(--accent),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:.32em;color:var(--dim);-webkit-text-fill-color:var(--dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;margin:14px 0;border-radius:99px;outline:none;background:linear-gradient(90deg,var(--gold) 0,var(--accent) var(--p,70%),#2a2347 var(--p,70%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:50%;background:#fbf8ff;border:5px solid var(--accent);box-shadow:0 0 0 7px rgba(238,75,34,.25),0 8px 20px rgba(0,0,0,.45);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fbf8ff;border:5px solid var(--accent);box-shadow:0 0 0 7px rgba(238,75,34,.25);cursor:grab}
.scale-ends{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.nps button{aspect-ratio:1/1.15;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:700 17px var(--f-display);font-variant-numeric:tabular-nums;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.nps button:hover{transform:translateY(-3px)}
.nps button[aria-pressed="true"]{color:#fff;border-color:transparent;transform:scale(1.12)}
.nps button.lo[aria-pressed="true"]{background:var(--brick);box-shadow:0 8px 20px -8px var(--brick)}
.nps button.mid[aria-pressed="true"]{background:var(--gold);color:#1b1630;box-shadow:0 8px 20px -8px var(--gold)}
.nps button.hi[aria-pressed="true"]{background:var(--green);box-shadow:0 8px 20px -8px var(--green)}
@media (max-width:520px){.nps{grid-template-columns:repeat(6,1fr)}}
textarea,select,input[type=text]{width:100%;font:600 16px var(--f-body);color:var(--fg);background:#14102a;border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .2s,box-shadow .2s}
textarea:focus,select:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(238,75,34,.18)}
::placeholder{color:#7d739c}
select option{background:#1b1630;color:var(--fg)}
textarea{min-height:130px;resize:vertical}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
nav.ctrl{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:16px;padding:15px 20px;font-weight:800;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn.primary{position:relative;overflow:hidden;flex:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;font-size:17px;box-shadow:0 14px 34px -12px var(--accent)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.btn.primary:disabled{opacity:.3;box-shadow:none;cursor:default}
.btn.primary:disabled::after{display:none}
.btn:active,.chip:active,.dot:active,.star:active,.face:active,.nps button:active{transform:scale(.93)}
.skip{background:none;border:none;color:var(--dim);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}
/* Gracias */
.thanks{text-align:left}
.check svg{width:84px;height:84px;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.check circle{stroke:var(--green)}
.check path{stroke:var(--mint)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,125px),1fr));gap:10px}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:800}
.sum b{font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.sum:nth-child(1) b{color:var(--gold)} .sum:nth-child(2) b{color:var(--accent-2)} .sum:nth-child(3) b{color:var(--lav)} .sum:nth-child(4) b{color:var(--mint)}
.note{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px;margin:0}
.evbox{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:rgba(238,75,34,.1);border:1px solid rgba(238,75,34,.35)}
.evbox span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:800}
.evbox b{font:700 18px var(--f-display);color:var(--fg)}
.field small{font-weight:600;color:var(--dim)}
.errmsg{color:var(--brick);font-weight:700;margin:0;min-height:0}
.errmsg:empty{display:none}
footer{text-align:center;font-size:12px;color:var(--dim)}
/* Movimiento (se apaga si el teléfono pide menos animación) */
@media (prefers-reduced-motion:no-preference){
.aura{animation:aura 18s ease-in-out infinite alternate}
@keyframes aura{to{transform:translate3d(4%,-3%,0) scale(1.08)}}
.bar span::after{animation:brillo 2.2s infinite}
@keyframes brillo{to{transform:translateX(100%)}}
.card.enter{animation:in .55s cubic-bezier(.2,.8,.2,1)}
.card.enter.adelante{animation-name:inR}
.card.enter.atras{animation-name:inL}
.card.enter>*{animation:sube .5s cubic-bezier(.2,.8,.2,1) both}
.card.enter>*:nth-child(2){animation-delay:.07s}.card.enter>*:nth-child(3){animation-delay:.14s}.card.enter>*:nth-child(4){animation-delay:.21s}.card.enter>*:nth-child(5){animation-delay:.28s}.card.enter>*:nth-child(6){animation-delay:.35s}.card.enter>*:nth-child(7){animation-delay:.42s}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(70px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-70px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{animation:flota 4s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px) rotate(-3deg)}}
.star.on svg{animation:estrella .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k,1)*60ms)}
@keyframes estrella{from{transform:scale(.2) rotate(-60deg)}to{transform:none}}
.face[aria-pressed="true"] svg,.emo.salta{animation:rebote .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes rebote{0%{transform:scale(.6)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.chip[aria-pressed="true"]{animation:pulso .35s}
@keyframes pulso{50%{transform:scale(1.08)}}
.btn.primary::after{animation:barrido 3s infinite}
@keyframes barrido{0%,60%{left:-60%}100%{left:130%}}
.check circle{stroke-dasharray:151;stroke-dashoffset:151;animation:traza .7s .15s forwards}
.check path{stroke-dasharray:40;stroke-dashoffset:40;animation:traza .45s .8s forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.sum{animation:sube .5s both}.sum:nth-child(2){animation-delay:.1s}.sum:nth-child(3){animation-delay:.2s}.sum:nth-child(4){animation-delay:.3s}
}
@media (prefers-reduced-motion:no-preference){.card.enter>.hero{animation:sube .5s both,flota 4s .6s ease-in-out infinite}}
/* ---- Solicitud de cotización ---- */
.lang{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:none;background:none;color:var(--dim);font-weight:800;font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:99px}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:4px 0 -10px}
.chip.ask{border-style:dashed}
.chip small{display:block;font-weight:600;font-size:12px;opacity:.8}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.pack{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:all .2s}
.pack b{font:700 17px var(--f-display)}
.pack small{color:var(--dim);font-weight:600;font-size:13px;line-height:1.35}
.pack .ico{font-size:24px}
.pack:hover{border-color:var(--accent-2)}
.pack[aria-pressed="true"]{border-color:var(--accent);background:rgba(238,75,34,.14);box-shadow:0 12px 26px -14px var(--accent)}
.need{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.need .pack{flex-direction:row;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font:800 22px var(--f-display)}
.stepper output{font:800 26px var(--f-display);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .btn{margin-left:auto}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(79,214,163,.08);border:1px solid rgba(79,214,163,.35);font-weight:700}
.item button{margin-left:auto;border:none;background:none;color:var(--dim);font-size:20px;padding:0 6px}
.items .vacio{color:var(--dim);font-weight:600;font-size:14px}
input[type=date],input[type=tel],input[type=email],input[type=number]{width:100%;font:600 16px var(--f-body);color:var(--fg);background:#14102a;border:1px solid var(--line);border-radius:14px;padding:14px;color-scheme:dark}
input[type=date]:focus,input[type=tel]:focus,input[type=email]:focus,input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(238,75,34,.18)}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);font-weight:700;cursor:pointer;display:block}
.drop small{display:block;color:var(--dim);font-weight:600;margin-top:4px}
.drop input{display:none}
.resumen{display:flex;flex-direction:column;gap:10px}
.rs{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rs header{display:flex;justify-content:space-between;align-items:center}
.rs header b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.rs header button{border:none;background:none;color:var(--accent-2);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.rs p{margin:0;color:var(--fg);font-weight:600;font-size:15px}
.rs p span{color:var(--dim);font-weight:600}
.folio{font:800 clamp(34px,9vw,52px)/1 var(--f-display);letter-spacing:-.02em;background:linear-gradient(120deg,var(--gold),var(--accent),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
.track{display:flex;flex-direction:column;gap:0}
.tk{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:18px}
.tk:last-child{padding-bottom:0}
.tk i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:800;z-index:1}
.tk:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tk.ok i{background:var(--green);border-color:var(--green);color:#fff}
.tk.ok:not(:last-child)::before{background:var(--green)}
.tk.ya i{border-color:var(--accent);box-shadow:0 0 0 5px rgba(238,75,34,.2)}
.tk b{display:block}
.tk small{color:var(--dim);font-weight:600}
.retoma{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(124,92,214,.14);border:1px solid rgba(124,92,214,.45)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gal button{padding:0;border:2px solid transparent;border-radius:16px;overflow:hidden;background:var(--panel);position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:8px;font-weight:800;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.gal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 10px 24px -10px var(--accent)}

  ${lbl("medida")}<div class="chips">${O.ledT[key].map(m=>`<button class="chip" data-led-m="${m}" aria-pressed="${LED.m===m}">${m}</button>`).join("")}<button class="chip ask" data-led-m="ase" aria-pressed="${LED.m==="ase"}">${LANG==="en"?"Not sure, advise me":"No sé, asesórenme"}</button></div>
  ${lbl("cant")}<div class="stepper"><button data-led-c="-1" aria-label="-">−</button><output>${LED.c}</output><button data-led-c="1" aria-label="+">+</button><button class="btn" data-led-add>＋ ${t("agregar")}</button></div>
  <p class="errmsg" id="ledErr"></p>
  <div class="items">${d.led.length?d.led.map((x,k)=>`<div class="item">✓ ${x.c} × ${esc(L(tipos.find(z=>V(z)===x.t)||x.t))} ${x.m==="ase"?"("+t("sugerir")+")":x.m+" m"}<button data-led-x="${k}" aria-label="Quitar">×</button></div>`).join(""):`<span class="vacio">${t("ledVacio")}</span>`}</div>`}
 if(q.id==="tarima"){const x=d.tarima;return `${lbl("medida")}<div class="chips">${O.tarima.map(m=>`<button class="chip" data-k="tarima.medida" data-v="${m}" aria-pressed="${x.medida===m}">${m}</button>`).join("")}<button class="chip" data-k="tarima.medida" data-v="Otra medida" aria-pressed="${x.medida==="Otra medida"}">${t("otraM")}</button><button class="chip ask" data-k="tarima.medida" data-v="Asesórenme" aria-pressed="${x.medida==="Asesórenme"}">${LANG==="en"?"Not sure, advise me":"No sé, asesórenme"}</button></div>
  ${x.medida==="Otra medida"?`<input type="text" data-in="tarimaOtra" maxlength="40" placeholder="${t("otraP")}" value="${esc(x.otra)}">`:""}${lbl("vinil")}${ch1("tarima.vinil",O.vinil)}${x.vinil==="Con vinil"?lbl("color")+ch1("tarima.color",O.color):""}${lbl("ubic")}${ch1("tarima.ubic",O.ubic)}`}
 if(q.id==="custom"){const c=d.custom;return `${lbl("cTipo")}${ch1("custom.tipo",O.cTipo)}${lbl("esp")}<div class="chips">${O.esp.map(o=>`<button class="chip" data-k="custom.espacio" data-v="${esc(V(o))}" aria-pressed="${c.espacio===V(o)}">${esc(L(o))}</button>`).join("")}<button class="chip" data-k="custom.espacio" data-v="Otra medida" aria-pressed="${c.espacio==="Otra medida"}">${t("otraM")}</button></div>
  ${c.espacio==="Otra medida"?`<input type="text" data-in="espOtro" maxlength="40" placeholder="${t("espP")}" value="${esc(c.espacioOtro)}">`:""}${lbl("elem")}${chN("custom.elementos",O.elem)}${lbl("estilo")}${ch1("custom.estilo",O.estilo)}${lbl("diseno")}${ch1("custom.diseno",O.diseno,1)}`}
 if(q.id==="galeria") return `<div class="gal">${GALERIA.map(g=>`<button data-k="estilo" data-v="${esc(g.es)}" aria-pressed="${d.estilo===g.es}"><img src="${esc(g.src)}" alt=""><span>${esc(LANG==="en"?g.en:g.es)}</span></button>`).join("")}</div>`;
 if(q.id==="pres") return `<input type="number" inputmode="numeric" min="0" step="1000" data-in="pres" placeholder="${t("presP")}" value="${esc(d.presupuesto)}" ${d.presNoDecir?"disabled":""}><div class="chips"><button class="chip ask" data-flag="presNoDecir" aria-pressed="${d.presNoDecir}">${t("noDecir")}</button></div>`;
 if(q.id==="com") return `<textarea data-in="com" maxlength="2000" placeholder="${t("comP")}">${esc(d.comentarios)}</textarea>
  <label class="drop">📎 ${t("adj")}<small>${t("adjH")}</small><input type="file" id="files" multiple accept="image/*,application/pdf"></label><p class="errmsg" id="adjErr"></p>
  <div class="items">${d.archivos.map((f,k)=>`<div class="item">📄 ${esc(f.name)}<button data-adj-x="${k}" aria-label="Quitar">×</button></div>`).join("")}</div>`;
 if(q.id==="resumen") return `<div class="resumen">${resumen().map(r=>`<div class="rs"><header><b>${t(r[0])}</b><button data-edit="${r[1]}">${t("edit")}</button></header>${r[2].filter(x=>x[1]).map(x=>`<p><span>${esc(x[0])}:</span> ${esc(x[1])}</p>`).join("")}</div>`).join("")}</div><p class="errmsg" id="err" role="alert"></p>`;
 return "";
}
function textoLed(x){return `${x.c} × ${x.t} ${x.m==="ase"?"(medida a sugerir)":x.m+" m"}`}
function resumen(){const d=A,es=LANG!=="en";const tr=v=>{if(!v)return"";for(const k in O){const arr=Array.isArray(O[k])?O[k]:Object.keys(O[k]);for(const o of arr){const s=Array.isArray(o)?o[1]:o;if(V(s)===v)return L(s)}}return v};
 const r=[["r_contacto","contacto",[[t("emp"),d.empresa],[t("nom"),d.nombre],[t("wa"),d.wa],[t("correo"),d.correo],[t("conocio"),tr(d.conocio)]]],
 ["r_evento","evento",[[es?"Tipo":"Type",tr(d.tipo)],[t("fecha"),d.sinFecha?t("tbd"):d.fecha.split("-").reverse().join("/")+" · "+tr(d.fechaEstado)],[t("dias"),tr(d.dias)],[t("horario"),tr(d.horario)]]],
 ["r_lugar","lugar",[[t("ciudad"),d.ciudad==="Otra ciudad"?d.ciudadOtra:d.ciudad],[t("tLugar"),tr(d.tipoLugar)],[t("tam"),tr(d.tamano)],[t("inv"),tr(d.invitados)],[t("lugar"),d.lugar]]],
 ["r_eq","necesita",[[es?"Necesita":"Needs",d.necesita.map(tr).join(", ")]]]];
 const eq=r[3][2];
 if(tiene("Audio")) eq.push([t("q_audio"),tr(d.audio.personas)+(es?" personas":" people")+" · "+t("micros")+": "+tr(d.audio.micros)]);
 if(tiene("Iluminación")) eq.push([t("q_luces"),tr(d.luces)]);
 if(tiene("Pantallas LED")) eq.push([t("q_led"),d.led.map(textoLed).join(" · ")]);
 if(tiene("Tarima")){const x=d.tarima;eq.push([t("q_tarima"),[x.medida==="Otra medida"?x.otra:tr(x.medida),tr(x.vinil),x.vinil==="Con vinil"?tr(x.color):"",tr(x.ubic)].filter(Boolean).join(" · ")])}
 if(tiene("Proyecto personalizado")){const c=d.custom;eq.push([t("q_custom"),[tr(c.tipo),c.espacio==="Otra medida"?c.espacioOtro:tr(c.espacio),c.elementos.map(tr).join(", "),tr(c.estilo),tr(c.diseno)].filter(Boolean).join(" · ")])}
 if(d.estilo) eq.push([t("estilo"),d.estilo]);
 r.push(["r_cierre","pres",[[t("q_pres"),d.presNoDecir?t("noDecir"):"L "+Number(d.presupuesto||0).toLocaleString("es-HN")],[es?"Comentarios":"Comments",d.comentarios],[es?"Archivos":"Files",d.archivos.map(f=>f.name).join(", ")]]]);
 return r;
}
function header(q){
 const vs=vis(),idx=vs.indexOf(q);
 $("#count").textContent=q.sec?`${idx+1} ${t("of")} ${vs.length}`:"";
 $("#bar").style.width=q.type==="fin"||q.type==="seg"?"100%":q.sec?`${(idx/vs.length)*100}%`:"0%";
 const cs=SECS.indexOf(q.sec);
 $("#sections").innerHTML=SECS.map((s,k)=>`<b class="${q.type==="fin"||k<cs?"done":k===cs?"on":""}">${t(s)}</b>`).join("");
 $("#sections").hidden=!q.sec;
 $("#langbox").innerHTML=`<button data-lang="es" aria-pressed="${LANG==="es"}">ES</button><button data-lang="en" aria-pressed="${LANG==="en"}">EN</button>`;
 document.documentElement.lang=LANG;$("#foot").innerHTML=redesHTML()+`<span>${t("foot")}</span>`;
}
function render(){
 const q=Q[i],m=$("#main");header(q);
 if(q.type==="intro"){const s=leerLS(),mis=misSol();
  m.innerHTML=`<section class="card enter"><img class="hero" src="logo-cubos.png" alt=""><span class="eyebrow">${t("eye")}</span><h1>${t("h1")}</h1><p class="lead">${t("lead")}</p>
  <div class="pills"><b>${t("pill1")}</b><b>${t("pill2")}</b><b>${t("pill3")}</b></div>
  ${s&&s.A.empresa?`<div class="retoma"><b>${t("retoma")}</b><button class="btn" data-retoma>${t("cont")} →</button></div>`:""}
  ${mis.length?`<div class="retoma"><b>${t("misT")}</b>${mis.slice(-3).reverse().map(x=>`<a class="btn" style="text-decoration:none;text-align:center" href="?seg=${encodeURIComponent(x.num)}&k=${encodeURIComponent(x.k)}">${esc(x.num)} · ${t("ver")}</a>`).join("")}</div>`:""}
  <h2 style="font-size:20px">${t("packT")}</h2><p class="hint" style="margin-top:-14px">${t("packH")}</p>
  <div class="packs">${PACKS.map(p=>`<button class="pack" data-pack="${p.id}" aria-pressed="${A.paquete===p.id}"><span class="ico">${p.ico}</span><b>${p[LANG][0]}</b><small>${p[LANG][1]}</small></button>`).join("")}</div>
  <nav class="ctrl"><button class="btn primary" data-go="1" id="next">${t("start")}</button></nav></section>`;return}
 if(q.type==="fin"){m.innerHTML=finHTML();return}
 if(q.type==="seg"){m.innerHTML=`<section class="card enter"><span class="eyebrow">${t("segEye")}</span><h2>${t("cargando")}</h2></section>`;cargarSeg();return}
 const vs=vis(),last=vs[vs.length-1]===q;
 m.innerHTML=`<section class="card enter"><span class="eyebrow">${t(q.sec)}</span><h2>${t(q.title)}</h2>${q.hint?`<p class="hint">${t(q.hint)}</p>`:""}
 ${cuerpo(q)}
 <nav class="ctrl"><button class="btn" data-go="-1" aria-label="${t("back")}">←</button><button class="btn primary" data-go="1" id="next" ${ok(q)?"":"disabled"}>${last?t("send"):t("next")}</button></nav></section>`;
}
function refresh(){const n=$("#next"),q=Q[i];if(n&&q.sec)n.disabled=!ok(q);guardarLS()}
function mover(d){const q=Q[i];if(q.sec&&d>0&&!ok(q))return;
 if(q.id==="resumen"&&d>0){enviar($("#next"));return}
 let j=i;do{j+=d}while(Q[j]&&Q[j].sec&&Q[j].show&&!Q[j].show());
 if(!Q[j]||Q[j].type==="fin"||Q[j].type==="seg")return;i=Math.max(0,j);render();guardarLS();window.scrollTo({top:0})}
// ---- Envío ----
const ID_ENVIO=Date.now().toString(36)+Math.random().toString(36).slice(2,10);let enviando=false,RES=null;
function enviar(b){if(enviando)return;enviando=true;b.disabled=true;b.textContent=t("sending");const e=$("#err");if(e)e.textContent="";
 const fin=r=>{enviando=false;RES=r;const mis=misSol();mis.push({num:r.num,k:r.k,ts:Date.now()});try{localStorage.setItem(LS_MIS,JSON.stringify(mis.slice(-10)));localStorage.removeItem(LS)}catch(x){}i=Q.findIndex(x=>x.type==="fin");render();window.scrollTo({top:0})};
 const fail=m=>{enviando=false;b.disabled=false;b.textContent=t("send");const el=$("#err");if(el)el.textContent=t("errSend")+(m?" ("+m+")":"")};
 const det=resumen().slice(3).map(r=>r[2].filter(x=>x[1]).map(x=>x[0]+": "+x[1]).join("\n")).join("\n");
 const body=Object.assign({accion:"cotizacion",id:ID_ENVIO,lang:LANG,resumen:det,ledTexto:A.led.map(textoLed).join(" · ")},A);
 if(DEMO){setTimeout(()=>fin({ok:true,num:"SOL-DEMO",k:"demo"}),900);return}
 fetch(URL_APP,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(r=>r.json()).then(j=>j&&j.ok?fin(j):fail(j&&j.error)).catch(()=>fail())}
function linkSeg(r){return location.origin+location.pathname+"?seg="+encodeURIComponent(r.num)+"&k="+encodeURIComponent(r.k)}
function finHTML(){const u=linkSeg(RES);setTimeout(confetti,300);
 return `<section class="card enter thanks"><div class="check"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
 <span class="eyebrow">${t("okEye")}</span><h1>${t("okH")}</h1><p class="lead">${t("okLead")}</p><div class="folio">${esc(RES.num)}</div>
 <p class="lead">${t("okNote")} ${A.correo?t("okMail"):""}</p><p class="hint" style="margin:0">${t("okSeg")}</p>
 <div class="evbox"><b style="font-size:14px;word-break:break-all">${esc(u)}</b></div>
 <nav class="ctrl"><button class="btn primary" data-copy="${esc(u)}">${t("copiar")}</button></nav>
 ${redesHTML()?`<p class="sub">${t("siguenos")}</p>${redesHTML()}`:""}
 <button class="skip" data-nueva>${t("nueva")}</button></section>`}
function cargarSeg(){const num=PRM.get("seg")||"",k=PRM.get("k")||"";
 const pinta=s=>{const est=s.estado,n=est==="Nueva"?1:est==="En proceso"?2:est==="Ganada"?4:3;
  const pasos=[["st1","st1s"],["st2","st2s"],["st3","st3s"]].concat(est==="Ganada"?[["st4","st4s"]]:[]);
  $("#main").innerHTML=`<section class="card enter"><span class="eyebrow">${t("segEye")}</span><div class="folio">${esc(num)}</div><p class="lead">${esc(s.empresa||"")}${s.evento?" · "+esc(s.evento):""}</p>
  <div class="track">${pasos.map((p,k)=>`<div class="tk ${k+1<n||(k+1===n&&n===4)?"ok":k+1===n?"ya ok":""}"><i>${k+1<=n?"✓":k+1}</i><div><b>${t(p[0])}</b><small>${t(p[1])}</small></div></div>`).join("")}</div>
  <button class="skip" data-nueva>${t("nueva")}</button></section>`};
 if(DEMO){pinta({estado:"En proceso",empresa:"Demo"});return}
 fetch(URL_APP,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"cotSeguimiento",num,k})}).then(r=>r.json())
 .then(j=>j&&j.ok?pinta(j):$("#main").innerHTML=`<section class="card"><h2>${t("segErr")}</h2><button class="skip" data-nueva>${t("nueva")}</button></section>`).catch(()=>$("#main").innerHTML=`<section class="card"><h2>${t("errSend")}</h2></section>`)}
// ---- Eventos ----
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const q=Q[i];
 if(b.dataset.lang){LANG=b.dataset.lang;render();guardarLS();return}
 if(b.dataset.go){mover(+b.dataset.go);return}
 if(b.hasAttribute("data-retoma")){const s=leerLS();A=Object.assign(nuevo(),s.A);LANG=s.lang||LANG;const k=Q.findIndex(x=>x.id===s.id);i=k>0?k:1;render();return}
 if(b.dataset.pack){const p=PACKS.find(x=>x.id===b.dataset.pack);const keep={empresa:A.empresa,nombre:A.nombre,wa:A.wa,correo:A.correo,conocio:A.conocio};A=Object.assign(nuevo(),keep,JSON.parse(JSON.stringify(p.set)),{paquete:p.id});render();guardarLS();setTimeout(()=>mover(1),450);return}
 if(b.dataset.k){set(b.dataset.k,b.dataset.v);render();guardarLS();return}
 if(b.dataset.tk){const a=get(b.dataset.tk),k=a.indexOf(b.dataset.v);k<0?a.push(b.dataset.v):a.splice(k,1);b.setAttribute("aria-pressed",k<0);refresh();return}
 if(b.dataset.flag){A[b.dataset.flag]=!A[b.dataset.flag];render();guardarLS();return}
 if(b.dataset.ledT){LED={t:b.dataset.ledT,m:"",c:1};render();return}
 if(b.dataset.ledM){LED.m=b.dataset.ledM;render();return}
 if(b.dataset.ledC){LED.c=Math.max(1,Math.min(20,LED.c+ +b.dataset.ledC));render();return}
 if(b.hasAttribute("data-led-add")){if(!LED.m){$("#ledErr").textContent=t("ledErr");return}A.led.push({t:LED.t,m:LED.m,c:LED.c});LED={t:LED.t,m:"",c:1};render();guardarLS();return}
 if(b.dataset.ledX){A.led.splice(+b.dataset.ledX,1);render();guardarLS();return}
 if(b.dataset.adjX){A.archivos.splice(+b.dataset.adjX,1);render();return}
 if(b.dataset.edit){i=Q.findIndex(x=>x.id===b.dataset.edit);render();window.scrollTo({top:0});return}
 if(b.dataset.copy){const u=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{b.textContent=t("copiado")}).catch(()=>{});return}
 if(b.hasAttribute("data-nueva")){A=nuevo();RES=null;history.replaceState(null,"",location.pathname+(DEMO?"?demo":""));i=0;render();return}
});
document.addEventListener("input",e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;const v=el.value;
 const map={emp:"empresa",nom:"nombre",wa:"wa",correo:"correo",ciudadOtra:"ciudadOtra",lugar:"lugar",fecha:"fecha",pres:"presupuesto",com:"comentarios"};
 if(map[k])A[map[k]]=map[k]==="correo"?v.trim():v;if(k==="tarimaOtra")A.tarima.otra=v;if(k==="espOtro")A.custom.espacioOtro=v;refresh()});
document.addEventListener("change",e=>{if(e.target.id!=="files")return;const er=$("#adjErr");er.textContent="";
 [...e.target.files].forEach(f=>{if(A.archivos.length>=3)return;if(f.size>5*1024*1024){er.textContent=t("adjErr");return}
  const r=new FileReader();r.onload=()=>{A.archivos.push({name:f.name.slice(0,120),type:f.type,data:String(r.result).split(",")[1]});render()};r.readAsDataURL(f)})});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){const n=$("#next");if(n&&!n.disabled)n.click()}});
// ---- Cubos del logo flotando y confeti ----
const cv=$("#lights"),cx=cv.getContext("2d");let W,H,parts=[],cubes=[];const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const PAL=[["#f06a22","#ee4b23","#a03022"],["#9c88be","#7b62a9","#5a3e99"],["#fce046","#f49b20","#ee4b23"]];
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;const n=Math.round(Math.min(16,Math.max(7,innerWidth/90)));cubes=[...Array(n)].map((_,k)=>({x:Math.random()*W,y:Math.random()*H,s:(12+Math.random()*26)*devicePixelRatio,v:(.15+Math.random()*.3)*devicePixelRatio,ph:Math.random()*6,p:PAL[k%3],o:.15+Math.random()*.25}))}
addEventListener("resize",size);size();
function cube(x,y,s,p,o){const h=s*.5;cx.globalAlpha=o;cx.fillStyle=p[0];cx.beginPath();cx.moveTo(x,y-s);cx.lineTo(x+s,y-h);cx.lineTo(x,y);cx.lineTo(x-s,y-h);cx.fill();cx.fillStyle=p[1];cx.beginPath();cx.moveTo(x-s,y-h);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.lineTo(x-s,y+h);cx.fill();cx.fillStyle=p[2];cx.beginPath();cx.moveTo(x+s,y-h);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.lineTo(x+s,y+h);cx.fill();cx.globalAlpha=1}
function draw(tm){cx.clearRect(0,0,W,H);for(const c of cubes){if(!still){c.y-=c.v;if(c.y<-c.s*2){c.y=H+c.s*2;c.x=Math.random()*W}}cube(c.x+Math.sin(tm*.0005+c.ph)*12*devicePixelRatio,c.y,c.s,c.p,c.o)}
 parts=parts.filter(p=>p.y<H+20);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12*devicePixelRatio;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
 if(!still||parts.length)requestAnimationFrame(draw)}
requestAnimationFrame(draw);
function confetti(){if(still)return;const cols=["#ee4b22","#7c5cd6","#f5a524","#4fd6a3"],d=devicePixelRatio;for(let k=0;k<140;k++)parts.push({x:W/2,y:H*.35,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*12-4)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,w:(6+Math.random()*6)*d,h:(3+Math.random()*4)*d,c:cols[k%4]})}
if(PRM.get("seg")){i=Q.findIndex(x=>x.type==="seg")}
render();
</script>
