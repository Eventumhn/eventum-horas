<style>
/* Layout: escenario oscuro con luces en movimiento; una pregunta por pantalla, barra de avance arriba, navegación abajo */
:root{
/* Paleta tomada del logo de Eventum */
--stage:#faf7f4; --panel:#ffffff; --panel-2:#efe8e2; --line:#e6ddd5; --card:rgba(255,255,255,.86);
--fg:#3b3b3b; --muted:#716a65; --accent:#ee4b23; --accent-2:#f06a22; --accent-ink:#ffffff;
--spot2:#5a3e99; --spot3:#f49b20; --lav:#9c88be; --brick:#a03022; --tint:#fdeee8;
--f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
--f-body:"Figtree",ui-sans-serif,system-ui,sans-serif;
color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font:16px/1.5 var(--f-body);overflow-x:hidden}
#lights{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;min-height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
padding-block:max(20px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:34px;width:auto;display:block}
.step-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.04em}
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--spot3),var(--accent),var(--spot2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sections{display:flex;gap:6px;flex-wrap:wrap}
.sections b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:700}
.sections b.on{color:var(--accent-ink);background:var(--spot2);border-color:var(--spot2)}
.sections b.done{color:var(--spot2);border-color:var(--lav)}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);box-shadow:0 24px 60px -30px rgba(90,62,153,.35);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,36px);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--spot2);font-weight:700}
h1,h2{color:#2e2e2e;font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(32px,7vw,48px);line-height:1.02;font-weight:800}
h2{font-size:clamp(24px,5vw,32px);line-height:1.1;font-weight:700}
.lead{color:var(--muted);margin:0;max-width:56ch}
.hint{font-size:14px;color:var(--muted);margin:-10px 0 0}
@media (prefers-reduced-motion:no-preference){
.card.enter{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
}
/* Controles */
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stars{display:flex;gap:8px;flex-wrap:wrap}
.star{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;transition:transform .15s,background .15s}
.star svg{width:28px;height:28px;fill:none;stroke:var(--muted);stroke-width:1.6;transition:all .2s}
.star.on{background:#fff4e0;border-color:var(--spot3)}
.star.on svg{fill:var(--spot3);stroke:var(--spot3)}
.star:hover{transform:translateY(-3px)}
.star-label{font:700 18px var(--f-display);min-height:27px;color:var(--spot3)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.face{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,background .15s}
.face svg{width:40px;height:40px}
.face small{font-size:12px;color:var(--muted);font-weight:600;text-align:center;line-height:1.2}
.face[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);transform:translateY(-4px)}
.face[aria-pressed="true"] small{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:11px 18px;font-weight:600;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.matrix{display:flex;flex-direction:column;gap:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel)}
.mrow .lbl{font-weight:600}
.mrow .lbl small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.dots{display:flex;gap:6px}
.dot{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.na{width:auto;padding:0 10px;font-size:12px}
@media (max-width:520px){.mrow{grid-template-columns:1fr}}
.range-wrap{display:flex;flex-direction:column;gap:10px}
.big{font:800 clamp(64px,16vw,104px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em;background:linear-gradient(120deg,var(--accent),var(--spot2));-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:.32em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.nps button{aspect-ratio:1/1.15;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.nps button[aria-pressed="true"]{color:var(--accent-ink);border-color:transparent}
.nps button.lo[aria-pressed="true"]{background:var(--brick)}
.nps button.mid[aria-pressed="true"]{background:var(--spot3)}
.nps button.hi[aria-pressed="true"]{background:var(--spot2)}
@media (max-width:520px){.nps{grid-template-columns:repeat(6,1fr)}}
textarea,select,input[type=text]{width:100%;font:500 16px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
textarea{min-height:130px;resize:vertical}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:600;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
nav.ctrl{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 20px;font-weight:700}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px;box-shadow:0 10px 30px -10px var(--accent)}
.btn.primary:disabled{opacity:.35;box-shadow:none;cursor:default}
.skip{background:none;border:none;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}
/* Gracias */
.thanks{text-align:left}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.sum{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.sum span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sum b{font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
.evbox{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid #f6cdbf}
.evbox span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.evbox b{font:700 18px var(--f-display);color:#2e2e2e}
.field small{font-weight:500;color:var(--muted)}
.errmsg{color:var(--brick);font-weight:600;margin:0;min-height:0}
.errmsg:empty{display:none}
footer{text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>

<script>
const URL_APP="https://script.google.com/macros/s/AKfycbyipUDT9rYIrbMsW1Nbu5XjPD3PN3Gh1dEb5dN-wffnSKhjNc9l93lkKlfJ8MPA-MNJ/exec";
const EV=(function(){const p=new URLSearchParams(location.search);const c=(p.get("ev")||"").slice(0,300);const m=c.match(/^(TGU|SPS)\|/);return{clave:c,titulo:(p.get("n")||"").trim().slice(0,150),ciudad:m?m[1]:""}})();
const EVENTOS=["Lanzamiento de marca","Congreso / convención","Activación BTL","Concierto o show","Evento corporativo interno","Feria o exposición","Otro"];
const STAR_TXT=["","Muy malo","Malo","Regular","Bueno","Excelente"];
const FACE_TXT=["Muy mal","Mal","Normal","Bien","Excelente"];
// Preguntas: una por pantalla. sec = sección mostrada arriba.
const Q=[
{id:"inicio",sec:null,type:"intro"},
{id:"datos",sec:"Tu evento",type:"datos",title:EV.titulo?"Tus datos":"Cuéntanos de qué evento hablamos",req:true},
{id:"atencion_trato",sec:"Atención",type:"faces",title:"¿Cómo te sentiste con el trato de nuestro equipo?",hint:"Coordinadoras, técnicos y producción.",req:true},
{id:"atencion_respuesta",sec:"Atención",type:"stars",title:"Rapidez y claridad para responder tus mensajes y solicitudes",req:true},
{id:"atencion_coordinacion",sec:"Atención",type:"chips1",title:"¿La coordinación antes del evento fue clara?",opts:["Sí, todo claro","En su mayoría","Hubo confusiones","No"],req:true},
{id:"servicio_tecnico",sec:"Servicio",type:"matrix",title:"Califica cada parte del servicio técnico",hint:"1 = muy malo · 5 = excelente",rows:[
["Sonido","Claridad, volumen, sin fallas"],["Iluminación","Ambiente y efectos"],["Pantallas y video","Imagen, contenidos, cambios"],["Montaje y escenografía","Orden, limpieza, acabados"],["Producción audiovisual","Fotos, video, transmisión"]],req:true},
{id:"servicio_puntualidad",sec:"Servicio",type:"chips1",title:"¿El montaje estuvo listo a tiempo?",opts:["Antes de lo acordado","Justo a tiempo","Con poco retraso","Con retraso importante"],req:true},
{id:"servicio_cotizado",sec:"Servicio",type:"chips1",title:"¿Recibiste todo lo que se cotizó?",opts:["Sí, todo y más","Sí, completo","Faltó algo menor","Faltó algo importante"],req:true},
{id:"evento_general",sec:"El evento",type:"range",title:"Del 1 al 10, ¿cómo calificas tu evento en general?",req:true},
{id:"evento_destaco",sec:"El evento",type:"chipsN",title:"¿Qué fue lo que más te gustó?",hint:"Elige todas las que quieras.",opts:["Sonido","Iluminación","Pantallas","Montaje","Puntualidad","Actitud del equipo","Creatividad","Producción audiovisual","Logística","Precio"],req:false},
{id:"recomendar",sec:"Recomendación",type:"nps",title:"¿Qué tan probable es que recomiendes Eventum a un colega o amigo?",req:true},
{id:"volver",sec:"Recomendación",type:"chips1",title:"¿Volverías a trabajar con nosotros?",opts:["Sí, sin duda","Probablemente","No lo sé","No"],req:true},
{id:"comentario",sec:"Recomendación",type:"text",title:"¿Algo que debamos mejorar o que quieras felicitar?",hint:"Opcional. Si mencionas a alguien del equipo, se lo haremos saber.",req:false},
{id:"fin",sec:null,type:"fin"}
];
const SECS=["Tu evento","Atención","Servicio","El evento","Recomendación"];
const A={}; let i=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const starSvg='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2 6.4 20.2l1.1-6.3L2.9 9.5l6.3-.9z" stroke-linejoin="round"/></svg>';
function faceSvg(k){
const mouths=["M15 31q9-8 18 0","M16 30q8-4 16 0","M16 29h16","M16 27q8 5 16 0","M14 26q10 11 20 0"];
const cols=["#a03022","#ee4b23","#f49b20","#9c88be","#5a3e99"];
return `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="${cols[k]}" stroke-width="2.5"/><circle cx="17" cy="19" r="2.4" fill="${cols[k]}"/><circle cx="31" cy="19" r="2.4" fill="${cols[k]}"/><path d="${mouths[k]}" fill="none" stroke="${cols[k]}" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}
function answered(q){
const v=A[q.id];
if(q.type==="datos") return v&&v.evento&&v.empresa&&v.nombre;
if(q.type==="matrix") return v&&q.rows.every(r=>v[r[0]]!=null);
if(q.type==="chipsN") return v&&v.length;
if(q.type==="text") return v&&v.trim();
return v!=null;
}
function render(){
const q=Q[i], m=$("#main");
const real=Q.filter(x=>x.sec), idx=real.indexOf(q);
$("#count").textContent=q.sec?`${idx+1} de ${real.length}`:"";
$("#bar").style.width=q.type==="fin"?"100%":q.sec?`${(idx/real.length)*100}%`:"0%";
const curSec=SECS.indexOf(q.sec);
$("#sections").innerHTML=SECS.map((s,k)=>`<b class="${q.type==="fin"||k<curSec?"done":k===curSec?"on":""}">${s}</b>`).join("");
$("#sections").hidden=!q.sec;
let body="";
if(q.type==="intro"){
m.innerHTML=`<section class="card enter">
<span class="eyebrow">Encuesta de satisfacción</span>
<h1>¿Cómo vivimos tu evento?</h1>
${EV.titulo?`<div class="evbox"><span>Evento</span><b>${esc(EV.titulo)}</b></div>`:""}
<p class="lead">Son 12 preguntas rápidas sobre la atención, el servicio y el resultado de tu evento. Toma menos de 3 minutos y nos ayuda a hacer cada montaje mejor que el anterior.</p>
<nav class="ctrl"><button class="btn primary" data-go="1">Empezar</button></nav></section>`;
return;
}
if(q.type==="fin"){ m.innerHTML=finHTML(); confetti(); return; }
if(q.type==="datos"){
const v=A.datos||(A.datos={clave:EV.clave,evento:EV.titulo,ciudad:EV.ciudad==="SPS"?"San Pedro Sula":EV.ciudad==="TGU"?"Tegucigalpa":"",empresa:"",nombre:""});
body=`${EV.titulo?`<div class="evbox"><span>Evento</span><b>${esc(EV.titulo)}</b></div>`:`<div class="field"><label for="d-evento">Nombre del evento</label><input type="text" id="d-evento" maxlength="150" placeholder="Ej. Lanzamiento de producto" value="${esc(v.evento)}"></div>`}
<div class="grid2">
<div class="field"><label for="d-emp">Empresa o marca</label><input type="text" id="d-emp" maxlength="120" value="${esc(v.empresa)}"></div>
<div class="field"><label for="d-nom">Tu nombre</label><input type="text" id="d-nom" maxlength="120" value="${esc(v.nombre)}"></div>
${EV.ciudad?"":`<div class="field"><label for="d-ciudad">Ciudad</label><select id="d-ciudad">${["Tegucigalpa","San Pedro Sula","Otra ciudad"].map(c=>`<option ${v.ciudad===c?"selected":""}>${c}</option>`).join("")}</select></div>`}</div>`;
}
if(q.type==="stars"){
const v=A[q.id]||0;
body=`<div class="stars" role="radiogroup">${[1,2,3,4,5].map(n=>`<button class="star ${n<=v?"on":""}" data-set="${n}" role="radio" aria-checked="${n===v}" aria-label="${n} de 5">${starSvg}</button>`).join("")}</div>
<div class="star-label">${STAR_TXT[v]||""}</div>`;
}
if(q.type==="faces"){
const v=A[q.id];
body=`<div class="faces">${[0,1,2,3,4].map(k=>`<button class="face" data-set="${k+1}" aria-pressed="${v===k+1}">${faceSvg(k)}<small>${FACE_TXT[k]}</small></button>`).join("")}</div>`;
}
if(q.type==="chips1"){
const v=A[q.id];
body=`<div class="chips">${q.opts.map(o=>`<button class="chip" data-set="${esc(o)}" aria-pressed="${v===o}">${o}</button>`).join("")}</div>`;
}
if(q.type==="chipsN"){
const v=A[q.id]||[];
body=`<div class="chips">${q.opts.map(o=>`<button class="chip" data-tog="${esc(o)}" aria-pressed="${v.includes(o)}">${o}</button>`).join("")}</div>`;
}
if(q.type==="matrix"){
const v=A[q.id]||{};
body=`<div class="matrix">${q.rows.map(([r,s])=>`<div class="mrow"><div class="lbl">${r}<small>${s}</small></div>
<div class="dots">${[1,2,3,4,5].map(n=>`<button class="dot" data-row="${r}" data-val="${n}" aria-pressed="${v[r]===n}" aria-label="${r}: ${n}">${n}</button>`).join("")}
<button class="dot na" data-row="${r}" data-val="0" aria-pressed="${v[r]===0}">No aplica</button></div></div>`).join("")}</div>`;
}
if(q.type==="range"){
const v=A[q.id]??8;
body=`<div class="range-wrap"><div class="big" id="bigv">${v}<small> / 10</small></div>
<input type="range" id="r-${q.id}" min="1" max="10" value="${v}" aria-label="Calificación general">
<div class="scale-ends"><span>1 · Nada satisfecho</span><span>10 · Totalmente satisfecho</span></div></div>`;
if(A[q.id]==null) A[q.id]=v;
}
if(q.type==="nps"){
const v=A[q.id];
body=`<div class="nps">${[...Array(11).keys()].map(n=>`<button class="${n<=6?"lo":n<=8?"mid":"hi"}" data-set="${n}" aria-pressed="${v===n}">${n}</button>`).join("")}</div>
<div class="scale-ends"><span>0 · Nada probable</span><span>10 · Muy probable</span></div>`;
}
if(q.type==="text"){
body=`<textarea id="t-${q.id}" placeholder="Escribe aquí tu comentario">${esc(A[q.id])}</textarea>`;
}
const last=Q[i+1].type==="fin";
m.innerHTML=`<section class="card enter">
<span class="eyebrow">${q.sec}</span>
<h2>${q.title}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}
${body}
<nav class="ctrl"><button class="btn" data-go="-1" aria-label="Anterior">←</button>
<button class="btn primary" data-go="1" id="next" ${q.req&&!answered(q)?"disabled":""}>${last?"Enviar respuestas":"Siguiente"}</button>
${!q.req&&!answered(q)?`<button class="skip" data-go="1">Omitir</button>`:""}</nav>
${last?`<p class="errmsg" id="err" role="alert"></p>`:""}</section>`;
}
function refreshNext(){const q=Q[i],n=$("#next");if(n)n.disabled=q.req&&!answered(q)}
function finHTML(){
const st=A.servicio_tecnico||{}, vals=Object.values(st).filter(x=>x>0);
const prom=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"—";
const nps=A.recomendar, tipo=nps>=9?"Promotor":nps>=7?"Neutral":"Detractor";
return `<section class="card enter thanks">
<span class="eyebrow">Respuestas enviadas</span>
<h1>¡Gracias por confiar en Eventum!</h1>
<p class="lead">Tu opinión llega directo a coordinación y al equipo técnico. Así se ven tus respuestas:</p>
<div class="summary">
<div class="sum"><span>Evento general</span><b>${A.evento_general} / 10</b></div>
<div class="sum"><span>Atención</span><b>${FACE_TXT[(A.atencion_trato||3)-1]}</b></div>
<div class="sum"><span>Servicio técnico</span><b>${prom} / 5</b></div>
<div class="sum"><span>Recomendación</span><b>${nps} · ${tipo}</b></div>
</div>
<p class="note">Ya puedes cerrar esta página. ¡Te esperamos en tu próximo evento!</p></section>`;
}
// Envío: se guarda en la hoja "Encuestas" de la app
const ID_ENVIO=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
let enviando=false;
function enviar(b){
if(enviando) return; enviando=true;
const txt=b.textContent; b.disabled=true; b.textContent="Enviando…";
const err=$("#err"); if(err) err.textContent="";
const ok=()=>{ enviando=false; i=Q.length-1; render(); window.scrollTo({top:0}); };
const fail=e=>{ enviando=false; b.disabled=false; b.textContent="Intentar de nuevo";
const el=$("#err"); if(el) el.textContent="No se pudieron enviar tus respuestas. "+((e&&e.message)||"Revisa tu conexión e inténtalo otra vez."); };
fetch(URL_APP,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({accion:"encuesta",id:ID_ENVIO},A))})
.then(r=>r.json()).then(j=>{ if(j&&j.ok) ok(); else fail({message:(j&&j.error)||""}); }).catch(()=>fail({}));
}
// Eventos
document.addEventListener("click",e=>{
const b=e.target.closest("button"); if(!b) return;
const q=Q[i];
if(b.dataset.go){ const d=+b.dataset.go;
if(d>0&&Q[i+1]&&Q[i+1].type==="fin"){ enviar(b); return; }
i=Math.max(0,Math.min(Q.length-1,i+d)); render(); window.scrollTo({top:0}); return; }
if(b.hasAttribute("data-retry")){ enviar(b); return; }
if(b.hasAttribute("data-restart")){ for(const k in A) delete A[k]; i=0; render(); return; }
if(b.dataset.set!=null){
const raw=b.dataset.set; A[q.id]=/^\d+$/.test(raw)?+raw:raw; render();
if(q.type!=="stars"&&q.type!=="nps"&&q.type!=="faces"&&q.type!=="chips1") return;
return;
}
if(b.dataset.tog){ const v=A[q.id]||(A[q.id]=[]); const k=v.indexOf(b.dataset.tog); k<0?v.push(b.dataset.tog):v.splice(k,1);
b.setAttribute("aria-pressed",k<0); refreshNext(); return; }
if(b.dataset.row){ const v=A[q.id]||(A[q.id]={}); v[b.dataset.row]=+b.dataset.val;
b.parentElement.querySelectorAll(".dot").forEach(x=>x.setAttribute("aria-pressed",x===b)); refreshNext(); }
});
document.addEventListener("input",e=>{
const q=Q[i], t=e.target;
if(t.type==="range"){ A[q.id]=+t.value; $("#bigv").innerHTML=`${t.value}<small> / 10</small>`; }
if(t.tagName==="TEXTAREA"){ A[q.id]=t.value; }
if(q.type==="datos"){ const v=A.datos; const g=id=>{const el=$(id);return el?el.value.trim():null};
if(g("#d-evento")!==null) v.evento=g("#d-evento"); v.empresa=g("#d-emp"); v.nombre=g("#d-nom"); if(g("#d-ciudad")!==null) v.ciudad=g("#d-ciudad"); refreshNext(); }
});
document.addEventListener("change",e=>{ if(Q[i].type==="datos") document.dispatchEvent(new Event("input")) });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="BUTTON"){ const n=$("#next"); if(n&&!n.disabled) n.click(); } });
// Luces de escenario en movimiento
const cv=$("#lights"), cx=cv.getContext("2d"); let W,H,parts=[];
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
// Cubos isométricos del logo flotando
const PAL=[["#f06a22","#ee4b23","#a03022"],["#9c88be","#7b62a9","#5a3e99"],["#fce046","#f49b20","#ee4b23"]];
let cubes=[];
function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
const n=Math.round(Math.min(18,Math.max(8,innerWidth/80)));cubes=[...Array(n)].map((_,k)=>({x:Math.random()*W,y:Math.random()*H,s:(14+Math.random()*30)*devicePixelRatio,v:(.15+Math.random()*.35)*devicePixelRatio,ph:Math.random()*6,p:PAL[k%3],o:.18+Math.random()*.3}))}
addEventListener("resize",size); size();
function cube(x,y,s,p,o){const h=s*.5;cx.globalAlpha=o;
cx.fillStyle=p[0];cx.beginPath();cx.moveTo(x,y-s);cx.lineTo(x+s,y-h);cx.lineTo(x,y);cx.lineTo(x-s,y-h);cx.fill();
cx.fillStyle=p[1];cx.beginPath();cx.moveTo(x-s,y-h);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.lineTo(x-s,y+h);cx.fill();
cx.fillStyle=p[2];cx.beginPath();cx.moveTo(x+s,y-h);cx.lineTo(x,y);cx.lineTo(x,y+s);cx.lineTo(x+s,y+h);cx.fill();cx.globalAlpha=1}
function draw(t){
cx.clearRect(0,0,W,H);
for(const c of cubes){ if(!still){c.y-=c.v; if(c.y<-c.s*2){c.y=H+c.s*2;c.x=Math.random()*W}}
cube(c.x+Math.sin(t*.0005+c.ph)*12*devicePixelRatio,c.y,c.s,c.p,c.o); }
parts=parts.filter(p=>p.y<H+20);
for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.12*devicePixelRatio; p.a+=p.va;
cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
if(!still||parts.length) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function confetti(){
if(still) return;
const cols=["#ee4b23","#5a3e99","#f49b20","#fce046"], d=devicePixelRatio;
for(let k=0;k<140;k++) parts.push({x:W/2,y:H*.35,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*12-4)*d,a:Math.random()*6,va:(Math.random()-.5)*.3,w:(6+Math.random()*6)*d,h:(3+Math.random()*4)*d,c:cols[k%4]});
}
render();
</script>
</body>
</html>
